name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check repository secret hygiene
        run: python3 backend/tools/secret_hygiene.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Audit locked backend dependencies
        run: make audit-backend-deps

      - name: Install locked backend dependencies
        run: uv sync --project backend --locked --extra ci

      - name: Lint backend
        run: uv run --project backend --locked --extra ci -- make lint

      - name: Run deployment contract tests
        run: uv run --project backend --locked --extra ci -- make test-deploy

      - name: Run fast backend tests with coverage
        run: >-
          uv run --project backend --locked --extra ci --
          make test-fast-coverage TEST_WORKERS=2
          ARGS="-W error::RuntimeWarning"

  postgresql-critical:
    name: PostgreSQL critical
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_DB: ai_writing_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_writing_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_writing_ci_test
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_writing_ci_test
      RUN_E2E_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        run: uv sync --locked --extra ci

      - name: Upgrade the dedicated database to Alembic head
        run: uv run --locked --extra ci -- alembic upgrade head

      - name: Capture pre-test PostgreSQL diagnostics
        env:
          POSTGRESQL_DIAGNOSTICS_PHASE: pre-test
        run: uv run --locked --extra ci -- python tools/postgresql_ci_diagnostics.py

      - name: Run serial PostgreSQL critical contracts
        run: uv run --locked --extra ci -- make -C .. test-postgresql-critical

      - name: Capture post-test PostgreSQL diagnostics
        if: always()
        env:
          POSTGRESQL_DIAGNOSTICS_PHASE: post-test
        run: uv run --locked --extra ci -- python tools/postgresql_ci_diagnostics.py

      - name: Upload PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgresql-critical-diagnostics
          path: |
            backend/.test-artifacts/postgresql-diagnostics-pre-test.json
            backend/.test-artifacts/postgresql-diagnostics-post-test.json
            backend/.test-artifacts/postgresql-critical.junit.xml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  frontend-unit-quality:
    name: Frontend unit quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend-console

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version-file: frontend-console/.node-version
          cache: npm
          cache-dependency-path: frontend-console/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Audit frontend dependency lockfile
        run: npm audit --package-lock-only --audit-level=high

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  production-image-contract:
    name: Production image contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and smoke-test production images
        run: make test-production-images

      - name: Create container SBOM artifact directory
        run: mkdir -p .test-artifacts/container-sbom

      - name: Generate backend image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: contract-smoke-backend:fixed-toolchain
          format: cyclonedx
          output: .test-artifacts/container-sbom/backend.cdx.json
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"
          timeout: 10m

      - name: Generate frontend image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: contract-smoke-frontend:fixed-toolchain
          format: cyclonedx
          output: .test-artifacts/container-sbom/frontend.cdx.json
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"
          timeout: 10m

      - name: Validate generated CycloneDX SBOMs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path(".test-artifacts/container-sbom/backend.cdx.json"),
              Path(".test-artifacts/container-sbom/frontend.cdx.json"),
          ):
              try:
                  document = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise SystemExit(f"Invalid CycloneDX JSON at {path}: {error}")
              if document.get("bomFormat") != "CycloneDX":
                  raise SystemExit(f"Expected CycloneDX bomFormat in {path}")
              components = document.get("components")
              if not isinstance(components, list) or not components:
                  raise SystemExit(f"Expected non-empty CycloneDX components in {path}")
          PY

      - name: Upload production image SBOMs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-image-sboms
          path: |
            .test-artifacts/container-sbom/backend.cdx.json
            .test-artifacts/container-sbom/frontend.cdx.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Gate backend image fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: contract-smoke-backend:fixed-toolchain
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m

      - name: Gate frontend image fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: contract-smoke-frontend:fixed-toolchain
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m
