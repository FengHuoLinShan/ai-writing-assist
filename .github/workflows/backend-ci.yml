name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify CI changes
        id: changes
        working-directory: ${{ github.workspace }}
        run: python3 scripts/classify_ci_changes.py

      - name: Check repository secret hygiene
        run: python3 backend/tools/secret_hygiene.py

      - name: Install uv and Python
        if: steps.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.14.8"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Audit locked backend dependencies
        if: steps.changes.outputs.backend == 'true'
        run: make audit-backend-deps

      - name: Install locked backend dependencies
        if: steps.changes.outputs.backend == 'true'
        run: uv sync --project backend --locked --extra ci

      - name: Lint backend
        if: steps.changes.outputs.backend == 'true'
        run: make lint

      - name: Run deployment contract tests
        if: steps.changes.outputs.backend == 'true'
        run: make test-deploy

      - name: Run fast backend tests with coverage
        if: steps.changes.outputs.backend == 'true'
        run: >-
          make test-fast-coverage TEST_WORKERS=2
          ARGS="-W error::RuntimeWarning"

      - name: Desktop source boundary tests (no installer build)
        if: steps.changes.outputs.backend == 'true'
        run: make desktop-test

      - name: Ask World offline launch gate (non-blocking diagnostic)
        if: steps.changes.outputs.backend == 'true' && github.event_name == 'push'
        continue-on-error: true
        run: make eval-ask-world OUTPUT=evals/artifacts/ask-world-gate.json

      - name: Upload Ask World gate report
        if: always() && steps.changes.outputs.backend == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ask-world-gate-report
          path: backend/evals/artifacts/ask-world-gate.json

  postgresql-critical:
    name: PostgreSQL critical
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: ai_writing_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_writing_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_writing_ci_test
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_writing_ci_test
      RUN_E2E_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify CI changes
        id: changes
        working-directory: ${{ github.workspace }}
        run: python3 scripts/classify_ci_changes.py

      - name: Install uv and Python
        if: steps.changes.outputs.postgresql == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.14.8"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install PostgreSQL 17 client
        if: steps.changes.outputs.postgresql == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output "$key_file"
          fingerprint="$(
            gpg --show-keys --with-colons "$key_file" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "$fingerprint" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo gpg --batch --yes --dearmor \
            --output /usr/share/keyrings/postgresql.gpg \
            "$key_file"
          echo \
            "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install locked backend dependencies
        if: steps.changes.outputs.postgresql == 'true'
        run: uv sync --locked --extra ci

      - name: Upgrade the dedicated database to Alembic head
        if: steps.changes.outputs.postgresql == 'true'
        run: uv run --locked --extra ci -- alembic upgrade head

      - name: Detect ORM drift with Alembic check
        if: steps.changes.outputs.postgresql == 'true'
        run: uv run --locked --extra ci -- alembic check

      - name: Capture pre-test PostgreSQL diagnostics
        if: steps.changes.outputs.postgresql == 'true'
        env:
          POSTGRESQL_DIAGNOSTICS_PHASE: pre-test
        run: uv run --locked --extra ci -- python tools/postgresql_ci_diagnostics.py

      - name: Prepare test artifacts directory
        if: steps.changes.outputs.postgresql == 'true'
        run: mkdir -p .test-artifacts

      - name: Run full serial PostgreSQL E2E contracts
        if: steps.changes.outputs.postgresql == 'true'
        run: >-
          make -C .. test-e2e
          ARGS="--timeout=180 --junitxml=.test-artifacts/postgresql-e2e.junit.xml"

      - name: Capture post-test PostgreSQL diagnostics
        if: always() && steps.changes.outputs.postgresql == 'true'
        env:
          POSTGRESQL_DIAGNOSTICS_PHASE: post-test
        run: uv run --locked --extra ci -- python tools/postgresql_ci_diagnostics.py

      - name: Upload PostgreSQL diagnostics
        if: always() && steps.changes.outputs.postgresql == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgresql-critical-diagnostics
          path: |
            backend/.test-artifacts/postgresql-diagnostics-pre-test.json
            backend/.test-artifacts/postgresql-diagnostics-post-test.json
            backend/.test-artifacts/postgresql-e2e.junit.xml
            backend/.test-artifacts/scale-*.json
            backend/.test-artifacts/evolution-issue209-native-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
