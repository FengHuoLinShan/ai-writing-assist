name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check repository secret hygiene
        run: python3 backend/tools/secret_hygiene.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        run: uv sync --project backend --locked --extra ci

      - name: Lint backend
        run: uv run --project backend --locked --extra ci -- make lint

      - name: Run fast backend tests with coverage
        run: >-
          uv run --project backend --locked --extra ci --
          make test-fast-coverage TEST_WORKERS=2
          ARGS="-W error::RuntimeWarning"

  frontend-unit-quality:
    name: Frontend unit quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend-console

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test
