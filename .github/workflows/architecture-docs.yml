name: Architecture docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: architecture-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-docs:
    name: Architecture docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate current architecture inventory
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_architecture_docs.py

      - name: Validate pull request architecture impact
        if: github.event_name == 'pull_request'
        env:
          ARCHITECTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 scripts/check_architecture_docs.py
          --base-ref "$ARCHITECTURE_BASE_SHA"
          --event-path "$GITHUB_EVENT_PATH"
