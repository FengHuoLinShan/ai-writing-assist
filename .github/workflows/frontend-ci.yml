name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit-quality:
    name: Frontend unit quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend-console

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify CI changes
        id: changes
        working-directory: ${{ github.workspace }}
        run: python3 scripts/classify_ci_changes.py

      - name: Install Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend-console/.node-version
          cache: npm
          cache-dependency-path: frontend-console/package-lock.json

      - name: Install locked frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Audit frontend dependency lockfile
        if: steps.changes.outputs.frontend == 'true'
        run: npm audit --package-lock-only --audit-level=high

      - name: Lint frontend sources
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      # Regression gates verify behavior, data and accessibility; screenshots are diagnostics only.
      - name: Run frontend unit tests
        if: steps.changes.outputs.frontend == 'true'
        run: npm test

  frontend-functional-browser:
    name: Frontend functional browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: ai_writing_functional_browser_agent_e2e_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "${{ github.run_id }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_writing_functional_browser_agent_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:${{ github.run_id }}@127.0.0.1:5432/ai_writing_functional_browser_agent_e2e_test"
      MAP_ATLAS_S3_BUCKET: "ai-writing-assist-map-atlas"
      WORLD_OBJECT_S3_BUCKET: "ai-writing-assist-world-objects"
      MAP_ATLAS_S3_REGION: "us-east-1"
      MAP_ATLAS_S3_ENDPOINT_URL: "http://127.0.0.1:9000"
      MAP_ATLAS_S3_ACCESS_KEY_ID: "novelist"
      MAP_ATLAS_S3_SECRET_ACCESS_KEY: "novel_minio_dev_pass"
      MAP_ATLAS_S3_FORCE_PATH_STYLE: "true"
      PW_REUSE_EXISTING_SERVER: "0"
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "8080"
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify CI changes
        id: changes
        working-directory: ${{ github.workspace }}
        run: python3 scripts/classify_ci_changes.py

      - name: Install uv and Python
        if: steps.changes.outputs.browser == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.3"
          python-version: "3.14.7"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Node.js
        if: steps.changes.outputs.browser == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend-console/.node-version
          cache: npm
          cache-dependency-path: frontend-console/package-lock.json

      - name: Install locked backend dependencies
        if: steps.changes.outputs.browser == 'true'
        run: uv sync --project backend --locked --extra ci

      - name: Install locked frontend dependencies
        if: steps.changes.outputs.browser == 'true'
        run: npm --prefix frontend-console ci

      - name: Install Chromium for Playwright
        if: steps.changes.outputs.browser == 'true'
        run: npm --prefix frontend-console exec playwright -- install --with-deps chromium

      - name: Start local object storage
        if: steps.changes.outputs.browser == 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/minio" https://github.com/minio/minio/releases/download/RELEASE.2025-04-22T22-12-26Z/minio.linux-amd64.RELEASE.2025-04-22T22-12-26Z
          echo "53e2a2cb16c5366ea6fbbc479c19ddb4c6a0948273e752f740fb1fbf27bb817c  $RUNNER_TEMP/minio" | sha256sum --check
          chmod +x "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=novel-minio-root MINIO_ROOT_PASSWORD=novel_minio_root_pass \
            "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address "127.0.0.1:9000" --console-address "127.0.0.1:9001" > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready

      - name: Initialize private object buckets
        if: steps.changes.outputs.browser == 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mc" https://github.com/minio/mc/releases/download/RELEASE.2025-03-12T17-29-24Z/mc.linux-amd64.RELEASE.2025-03-12T17-29-24Z
          echo "a92b5f1af200ca25d54d78432ef6b0c47fd4340abf9759ce5d10275cd57e3318  $RUNNER_TEMP/mc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/mc"
          PATH="$RUNNER_TEMP:$PATH" MC_CONFIG_DIR="$RUNNER_TEMP/mc-config" \
            MINIO_ENDPOINT_URL=http://127.0.0.1:9000 MINIO_ROOT_USER=novel-minio-root \
            MINIO_ROOT_PASSWORD=novel_minio_root_pass MINIO_APP_ACCESS_KEY=novelist \
            MINIO_APP_SECRET_KEY=novel_minio_dev_pass sh docker/init-minio.sh

      # Frontend changes run all behavior tests, including theme, reader and workspace flows.
      - name: Run frontend functional browser
        if: steps.changes.outputs.browser == 'true'
        env:
          BROWSER_SUITE: ${{ steps.changes.outputs.browser_suite }}
        run: >-
          uv run --project backend --locked --extra ci --
          npm --prefix frontend-console run "$BROWSER_SUITE" -- --workers=1 --retries=0

      - name: Run assistant behavior with its isolated synthetic model harness
        if: steps.changes.outputs.browser == 'true'
        run: >-
          uv run --project backend --locked --extra ci --
          npm --prefix frontend-console run test:e2e:assistant -- --workers=1 --retries=0

      - name: Run creative forecast with its isolated synthetic model harness
        if: steps.changes.outputs.browser == 'true'
        run: >-
          uv run --project backend --locked --extra ci --
          npm --prefix frontend-console run test:e2e:creative -- --workers=1 --retries=0

      - name: Run editorial flow with its isolated feature flags
        if: steps.changes.outputs.browser == 'true'
        run: >-
          uv run --project backend --locked --extra ci --
          npm --prefix frontend-console run test:e2e:editorial -- --workers=1 --retries=0

      - name: Upload frontend functional browser diagnostics
        if: failure() && steps.changes.outputs.browser == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-functional-browser-diagnostics
          path: frontend-console/test-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
