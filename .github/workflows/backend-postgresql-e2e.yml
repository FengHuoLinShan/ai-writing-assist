name: Backend PostgreSQL E2E

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-postgresql-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgresql-e2e:
    name: PostgreSQL full E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: ai_writing_nightly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_writing_nightly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_writing_nightly_test
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ai_writing_nightly_test
      RUN_E2E_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output "$key_file"
          fingerprint="$(
            gpg --show-keys --with-colons "$key_file" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          test "$fingerprint" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo gpg --batch --yes --dearmor \
            --output /usr/share/keyrings/postgresql.gpg \
            "$key_file"
          echo \
            "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install locked backend dependencies
        run: uv sync --locked --extra ci

      - name: Upgrade the dedicated database to Alembic head
        run: uv run --locked --extra ci -- alembic upgrade head

      - name: Prepare test artifacts directory
        run: mkdir -p .test-artifacts

      - name: Run the full serial PostgreSQL E2E suite
        run: >-
          uv run --locked --extra ci -- pytest tests/e2e
          -m "not real_llm and not external_data"
          --timeout=180
          --junitxml=.test-artifacts/postgresql-e2e.junit.xml

      - name: Capture PostgreSQL diagnostics
        if: always()
        env:
          POSTGRESQL_DIAGNOSTICS_PHASE: post-test
        run: uv run --locked --extra ci -- python tools/postgresql_ci_diagnostics.py

      - name: Upload PostgreSQL E2E diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgresql-e2e-diagnostics
          path: |
            backend/.test-artifacts/postgresql-diagnostics-post-test.json
            backend/.test-artifacts/postgresql-e2e.junit.xml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
