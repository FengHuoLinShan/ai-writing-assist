name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build only the selected platform; all must be explicitly requested'
        type: choice
        default: macos-arm64
        options: [macos-arm64, macos-x64, windows-x64, all]
  workflow_call:
    inputs:
      target:
        type: string
        default: macos-arm64
      source_sha:
        required: true
        type: string
      signed:
        default: false
        type: boolean
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE_P12:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Select requested platforms
        id: targets
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: python3 desktop/release.py matrix "$BUILD_TARGET" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: ${{ !inputs.signed || github.ref == 'refs/heads/main' }}
    concurrency:
      group: desktop-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Validate signed source
        if: inputs.signed
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend-console/.node-version
      - run: uv sync --project backend --locked --extra desktop --extra ci
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: |
          uv pip install --python backend/.venv/Scripts/python.exe meson==1.12.1 ninja==1.13.2
          choco install winflexbison3 --yes --no-progress
      - name: Lint desktop code
        run: uv run --project backend --no-sync ruff check --config backend/pyproject.toml desktop
      - name: Parse Windows signing script
        if: runner.os == 'Windows'
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path desktop/sign_windows.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - name: Desktop access boundary tests
        run: uv run --project backend --no-sync python -m pytest desktop/tests backend/infrastructure/tasks/tests/test_liveness.py::test_control_loop_marker_writes_an_atomic_private_monotonic_value -q
      - name: Prepare Apple signing
        if: runner.os == 'macOS' && inputs.signed
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOVELCRAFT_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: backend/.venv/bin/python desktop/sign_macos.py prepare
      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          NOVELCRAFT_CODESIGN_IDENTITY: ${{ inputs.signed && secrets.MACOS_SIGNING_IDENTITY || '' }}
          BUILD_TARGET: ${{ matrix.platform }}
        run: backend/.venv/bin/python desktop/build.py --target "$BUILD_TARGET"
      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "NOVELCRAFT_VS_INSTALL=%%i"
          if not defined NOVELCRAFT_VS_INSTALL exit /b 1
          call "%NOVELCRAFT_VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          set CC=cl
          set CXX=cl
          backend\.venv\Scripts\python.exe desktop\build.py --target windows-x64
      - name: Sign Windows executables
        if: runner.os == 'Windows' && inputs.signed
        env:
          WINDOWS_CERTIFICATE_P12: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./desktop/sign_windows.ps1 app
      - name: Native runtime smoke
        run: uv run --project backend --no-sync python desktop/smoke.py --frozen
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop/build/dmg
          cp -R desktop/dist/NovelCraft.app desktop/build/dmg/
          ln -s /Applications desktop/build/dmg/Applications
          hdiutil create -volname NovelCraft -srcfolder desktop/build/dmg -ov -format UDZO desktop/dist/NovelCraft-${{ runner.arch }}.dmg
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop/windows.iss'
      - name: Sign Windows installer
        if: runner.os == 'Windows' && inputs.signed
        env:
          WINDOWS_CERTIFICATE_P12: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./desktop/sign_windows.ps1 installer
      - name: Install and run Windows package
        if: runner.os == 'Windows'
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'NovelCraft installed'
          $setup = Start-Process desktop/dist/NovelCraft-Windows-x64-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $install + '"')) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          uv run --project backend --no-sync python desktop/smoke.py --installed "$install"
          $smokeExit = $LASTEXITCODE
          $uninstall = Start-Process (Join-Path $install 'unins000.exe') -ArgumentList @('/VERYSILENT', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path (Join-Path $install 'NovelCraft.exe'))) { throw 'Uninstall failed' }
          if ($smokeExit -ne 0) { exit $smokeExit }
      - name: Notarize macOS package
        if: runner.os == 'macOS' && inputs.signed
        env:
          NOVELCRAFT_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: backend/.venv/bin/python desktop/sign_macos.py notarize desktop/dist/NovelCraft-${{ runner.arch }}.dmg
      - name: Version artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          SIGNED: ${{ inputs.signed }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            source="desktop/dist/NovelCraft-$RUNNER_ARCH.dmg"
          else
            source=desktop/dist/NovelCraft-Windows-x64-Setup.exe
          fi
          args=()
          if [ "$SIGNED" = true ]; then args+=(--signed); fi
          uv run --project backend --no-sync python desktop/release.py package "$source" "$PLATFORM" "${args[@]}"
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NovelCraft-${{ matrix.os }}
          path: desktop/dist/release/*
          retention-days: 14
          if-no-files-found: error
      - name: Clean signing keychain
        if: always() && runner.os == 'macOS' && inputs.signed
        run: backend/.venv/bin/python desktop/sign_macos.py cleanup
