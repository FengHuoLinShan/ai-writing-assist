version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: tuesday
      time: "02:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend-console
    schedule:
      interval: weekly
      day: wednesday
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend-console
    schedule:
      interval: weekly
      day: thursday
      time: "02:40"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: friday
      time: "02:50"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
