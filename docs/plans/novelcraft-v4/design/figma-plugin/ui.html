<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:13px/1.7 system-ui,sans-serif;padding:18px;color:#1e2a3b;background:#fffdf9}h2{font-size:20px;margin:0 0 12px}select,button{font:inherit;border-radius:8px;padding:9px 12px;border:1px solid #dedcd5}select{width:100%;background:white}button{margin:12px 6px 0 0;background:#284c56;color:white;cursor:pointer}button.secondary{background:white;color:#284c56}#log{height:92px;overflow:auto;white-space:pre-wrap;background:#f6f4f0;padding:10px;border-radius:8px;font-size:11px}progress{width:100%}small{color:#667281}</style><h2>NovelCraft V4 · 原生设计导入</h2><p>新建一个页面；不覆盖现有内容。文字与矢量图可编辑，按钮/状态为组件。全量画面较多，首次建议先导入核心流程。</p><select id="scope"><option value="core">核心流程（14 稿）</option><option value="all">全部 49 稿</option><option value="map">地图与媒体（10 稿）</option><option value="mobile">移动端（5 稿）</option></select><div><button id="create">开始导入</button><button class="secondary" id="cancel">停止新增</button><button class="secondary" id="close">关闭</button></div><p id="status">离线数据，不访问网络或真实小说。</p><progress id="progress" max="100" value="0"></progress><pre id="log">本插件未在本轮 Figma 环境执行；请导入后检查字体和连线。</pre><script>const send=t=>parent.postMessage({pluginMessage:{type:t,scope:document.querySelector('#scope').value}},'*');for(const id of ['create','cancel','close'])document.getElementById(id).onclick=()=>send(id);onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='status'){document.querySelector('#status').textContent=m.text;if(m.progress!==null)document.querySelector('#progress').value=m.progress}if(m.type==='done'||m.type==='error')document.querySelector('#log').textContent=JSON.stringify(m,null,2)};</script></html>
