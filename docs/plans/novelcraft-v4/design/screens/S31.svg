 id="n3171" data-name="Panel" transform="translate(253,237)"><rect width="934" height="660" rx="16" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3172" data-name="城门将关" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="33" font-weight="400" fill="#1E2A3B" text-anchor="start"><tspan x="46" y="65.30000000000001">城门将关</tspan></text><text id="n3173" data-name="守卫抬起手，拦住了你。城墙后的最后一线光已经消失，钟楼上的影子拖过石板路。  “明早再来。”他说。  你摸到" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="22" font-weight="400" fill="#485365" text-anchor="start"><tspan x="46" y="138.2">守卫抬起手，拦住了你。城墙后的最后一线光已经消失，钟楼上的影子拖过石板路。</tspan><tspan x="46" y="181.1"></tspan><tspan x="46" y="224.0">“明早再来。”他说。</tspan><tspan x="46" y="266.9"></tspan><tspan x="46" y="309.79999999999995">你摸到衣襟里的信。信封上没有收件人的名字，只有一道像井口一样的圆印。</tspan></text><path id="n3174" data-name="Divider" d="M 46 415 L 888 415" fill="none" stroke="#DEDCD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text id="n3175" data-name="你准备怎么做？" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#667281" text-anchor="start"><tspan x="46" y="464.6">你准备怎么做？</tspan></text><rect id="n3176" data-name="Surface" x="46" y="491" width="840" height="90" rx="10" fill="#F6F4F0" stroke="none"/><text id="n3177" data-name="向守卫说明送信的缘由…" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#485365" text-anchor="start"><tspan x="64" y="530.8">向守卫说明送信的缘由…</tspan></text><g id="n3178" data-name="Button / 继续故事" data-target="S31" tabindex="0" role="button" aria-label="Button / 继续故事" transform="translate(686,591)"><rect width="200" height="44" rx="10" fill="#284C56" stroke="none" stroke-width="1"/><text id="n3179" data-name="继续故事" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle"><tspan x="100.0" y="26.550000000000004">继续故事</tspan></text></g><g id="n3180" data-name="Button / 查看分支" data-target="S32" tabindex="0" role="button" aria-label="Button / 查看分支" transform="translate(46,591)"><text id="n3181" data-name="查看分支" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#284C56" text-anchor="middle"><tspan x="72.5" y="26.550000000000004">查看分支</tspan></text></g><g id="n3182" data-name="Button / 重新生成" data-target="S31" tabindex="0" role="button" aria-label="Button / 重新生成" transform="translate(211,591)"><text id="n3183" data-name="重新生成" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#284C56" text-anchor="middle"><tspan x="72.5" y="26.550000000000004">重新生成</tspan></text></g></g></g></svg>