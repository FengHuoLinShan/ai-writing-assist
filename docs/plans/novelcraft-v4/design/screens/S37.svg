<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="移动写作"><title>移动写作</title><g id="n3639" data-name="S37 · 移动写作" transform="translate(0,0)"><rect width="390" height="844" rx="0" fill="#F6F4F0" stroke="none" stroke-width="1"/><rect id="n3640" data-name="Surface" x="0" y="0" width="390" height="46" rx="0" fill="#FFFDF9" stroke="none"/><text id="n3641" data-name="9:41" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="500" fill="#1E2A3B" text-anchor="start"><tspan x="22" y="26.3">9:41</tspan></text><text id="n3642" data-name="5G  ▰" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#1E2A3B" text-anchor="start"><tspan x="308" y="25.200000000000003">5G  ▰</tspan></text><rect id="n3643" data-name="Surface" x="0" y="46" width="390" height="66" rx="0" fill="#FFFDF9" stroke="none"/><g id="n3644" data-name="Icon / back" transform="translate(18,65)"><path id="n3645" data-name="Stroke" d="M 19 12 L 4 12 M 10 6 L 4 12 L 10 18" fill="none" stroke="#667281" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.9166666666666666)"/></g><text id="n3646" data-name="第 12 章" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" fill="#1E2A3B" text-anchor="start"><tspan x="58" y="84.9">第 12 章</tspan></text><g id="n3647" data-name="Status / 已保存" transform="translate(293,65)"><rect width="78" height="28" rx="7" fill="#E8F1EB" stroke="none" stroke-width="1"/><text id="n3648" data-name="已保存" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="500" fill="#326F62" text-anchor="middle"><tspan x="39.0" y="17.200000000000003">已保存</tspan></text></g><text id="n3649" data-name="没有寄出的信" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="28" font-weight="400" fill="#1E2A3B" text-anchor="start"><tspan x="24" y="174.8">没有寄出的信</tspan></text><text id="n3650" data-name="暮色落在白石城的石阶上。林舟把湿透的外衣搭在椅背，听见窗外有人轻轻叩了三下。" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="19" font-weight="400" fill="#485365" text-anchor="start"><tspan x="24" y="236.9">暮色落在白石城的石阶上。林舟把湿透</tspan><tspan x="24" y="273.95">的外衣搭在椅背，听见窗外有人轻轻叩</tspan><tspan x="24" y="311.0">了三下。</tspan></text><text id="n3651" data-name="青竹没有立刻进门。她站在门廊的阴影里，手里攥着那把铜钥匙，像是还没想好应当把它交给谁。" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="19" font-weight="400" fill="#485365" text-anchor="start"><tspan x="24" y="370.9">青竹没有立刻进门。她站在门廊的阴影</tspan><tspan x="24" y="407.95">里，手里攥着那把铜钥匙，像是还没想</tspan><tspan x="24" y="445.0">好应当把它交给谁。</tspan></text><text id="n3652" data-name="“先放在你这里。”林舟说，“等北岸的信到了，我会回来取。”" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="19" font-weight="400" fill="#485365" text-anchor="start"><tspan x="24" y="504.9">“先放在你这里。”林舟说，“等北岸</tspan><tspan x="24" y="541.9499999999999">的信到了，我会回来取。”</tspan></text><rect id="n3653" data-name="Surface" x="0" y="731" width="390" height="113" rx="0" fill="#FFFDF9" stroke="none"/><path id="n3654" data-name="Divider" d="M 0 731 L 390 731" fill="none" stroke="#DEDCD5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><g id="n3655" data-name="Button / 继续写" data-target="S37" tabindex="0" role="button" aria-label="Button / 继续写" transform="translate(20,753)"><rect width="223" height="44" rx="10" fill="#284C56" stroke="none" stroke-width="1"/><text id="n3656" data-name="继续写" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle"><tspan x="111.5" y="26.550000000000004">继续写</tspan></text></g><g id="n3657" data-name="Button / 1 个提醒" data-target="S38" tabindex="0" role="button" aria-label="Button / 1 个提醒" transform="translate(253,753)"><rect width="117" height="44" rx="10" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3658" data-name="1 个提醒" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#1E2A3B" text-anchor="middle"><tspan x="58.5" y="26.550000000000004">1 个提醒</tspan></text></g><rect id="n3659" data-name="Surface" x="145" y="827" width="100" height="4" rx="2" fill="#1E2A3B" stroke="none"/></g></svg>