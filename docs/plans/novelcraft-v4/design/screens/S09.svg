 stroke="#667281" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.7083333333333334)"/></g><text id="n824" data-name="找人物、场景、原文…" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#667281" text-anchor="start"><tspan x="42" y="22.200000000000003">找人物、场景、原文…</tspan></text></g><g id="n825" data-name="Status / 已保存" transform="translate(1210,18)"><rect width="72" height="28" rx="7" fill="#E8F1EB" stroke="none" stroke-width="1"/><text id="n826" data-name="已保存" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="500" fill="#326F62" text-anchor="middle"><tspan x="36.0" y="17.200000000000003">已保存</tspan></text></g><g id="n827" data-name="Button / 项目设置" data-target="S32" tabindex="0" role="button" aria-label="Button / 项目设置" transform="translate(1300,10)"><text id="n828" data-name="项目设置" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="500" fill="#284C56" text-anchor="middle"><tspan x="55.0" y="25.9">项目设置</tspan></text></g><text id="n829" data-name="不要急着选一个答案" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#1E2A3B" text-anchor="start"><tspan x="228" y="126.80000000000001">不要急着选一个答案</tspan></text><text id="n830" data-name="三个独立视角先各自展开。它们是可选方向，不是投票得出的“正确剧情”。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#667281" text-anchor="start"><tspan x="228" y="155.3">三个独立视角先各自展开。它们是可选方向，不是投票得出的“正确剧情”。</tspan></text><g id="n831" data-name="Panel" transform="translate(228,190)"><rect width="376" height="540" rx="16" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><g id="n832" data-name="Status / 人物选择" transform="translate(22,22)"><rect width="68" height="28" rx="7" fill="#E8F1EB" stroke="none" stroke-width="1"/><text id="n833" data-name="人物选择" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="500" fill="#326F62" text-anchor="middle"><tspan x="34.0" y="17.200000000000003">人物选择</tspan></text></g><text id="n834" data-name="青竹先收好钥匙，却拒绝替他守密。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" fill="#1E2A3B" text-anchor="start"><tspan x="22" y="87.0">青竹先收好钥匙，却拒绝替他守密。</tspan></text><text id="n835" data-name="她不是被动接受任务的人。下一步可让她提出一个不涉及新秘密的交换条件。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#485365" text-anchor="start"><tspan x="22" y="123.4">她不是被动接受任务的人。下一步可让她提出一个不</tspan><tspan x="22" y="145.1">涉及新秘密的交换条件。</tspan></text><text id="n836" data-name="代价：需要兑现她的自主行动。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#485365" text-anchor="start"><tspan x="22" y="345.4">代价：需要兑现她的自主行动。</tspan></text><text id="n837" data-name="依赖：当前选段、人物已采用资料 尚未验证：后续情节效果" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#667281" text-anchor="start"><tspan x="22" y="408.2">依赖：当前选段、人物已采用资料</tspan><tspan x="22" y="426.8">尚未验证：后续情节效果</tspan></text><g id="n838" data-name="Button / 展开这个方向" data-target="S10" tabindex="0" role="button" aria-label="Button / 展开这个方向" transform="translate(22,463)"><rect width="332" height="44" rx="10" fill="#284C56" stroke="none" stroke-width="1"/><text id="n839" data-name="展开这个方向" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle"><tspan x="166.0" y="26.550000000000004">展开这个方向</tspan></text></g></g><g id="n840" data-name="Panel" transform="translate(632,190)"><rect width="376" height="540" rx="16" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/