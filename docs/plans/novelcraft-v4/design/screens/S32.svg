rosoft YaHei,sans-serif" font-size="20" font-weight="500" fill="#1E2A3B" text-anchor="start"><tspan x="22" y="44.0">导出正文</tspan></text><text id="n3249" data-name="只导出指定章节与已选择正文版本；未采用候选单独列出。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#485365" text-anchor="start"><tspan x="22" y="80.4">只导出指定章节与已选择正文版本；未采用候选单独</tspan><tspan x="22" y="102.10000000000001">列出。</tspan></text><g id="n3250" data-name="Button / 预览导出范围" data-target="S36" tabindex="0" role="button" aria-label="Button / 预览导出范围" transform="translate(22,271)"><rect width="332" height="44" rx="10" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3251" data-name="预览导出范围" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#1E2A3B" text-anchor="middle"><tspan x="166.0" y="26.550000000000004">预览导出范围</tspan></text></g></g><g id="n3252" data-name="Panel" transform="translate(632,190)"><rect width="376" height="335" rx="16" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3253" data-name="版本与恢复" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" fill="#1E2A3B" text-anchor="start"><tspan x="22" y="44.0">版本与恢复</tspan></text><text id="n3254" data-name="回看保存历史，从旧版本继续写成新稿；不覆盖后来人工改动。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#485365" text-anchor="start"><tspan x="22" y="80.4">回看保存历史，从旧版本继续写成新稿；不覆盖后来</tspan><tspan x="22" y="102.10000000000001">人工改动。</tspan></text><g id="n3255" data-name="Button / 查看版本差异" data-target="S33" tabindex="0" role="button" aria-label="Button / 查看版本差异" transform="translate(22,271)"><rect width="332" height="44" rx="10" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3256" data-name="查看版本差异" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#1E2A3B" text-anchor="middle"><tspan x="166.0" y="26.550000000000004">查看版本差异</tspan></text></g></g><g id="n3257" data-name="Panel" transform="translate(1036,190)"><rect width="376" height="335" rx="16" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3258" data-name="资料与地图" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" fill="#1E2A3B" text-anchor="start"><tspan x="22" y="44.0">资料与地图</tspan></text><text id="n3259" data-name="按已授权视图导出资料；公开分享需要另行完成安全发布链。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#485365" text-anchor="start"><tspan x="22" y="80.4">按已授权视图导出资料；公开分享需要另行完成安全</tspan><tspan x="22" y="102.10000000000001">发布链。</tspan></text><g id="n3260" data-name="Button / 核对资料范围" data-target="S36" tabindex="0" role="button" aria-label="Button / 核对资料范围" transform="translate(22,271)"><rect width="332" height="44" rx="10" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3261" data-name="核对资料范围" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#1E2A3B" text-anchor="middle"><tspan x="166.0" y="26.550000000000004">核对资料范围</tspan></text></g></g><g id="n3262" data-name="Panel" transform="translate(228,553)"><rect width="1184" height="335" rx="16" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3263" data-name="项目生命周期" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" fill="#1E2A3B" text-anchor="start"><tspan x="24" y="50.2">项目生命周期</tspan></text><text id="n3264" data-name="归档只是停止日常显示；永久删除会清理原文、派生理解、索引、缓存和保留图片。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#485365" text-anchor="start"><tspan x="24" y="101.7">归档只是停止日常显示；永久删除会清理原文、派生理解、索引、缓存和保留图片。</tspan></text><g id="n3265" data-name="Button / 归档本书" data-target="S32" tabindex="0" role="button" aria-label="Button / 归档本书" transform="translate(24,179)"><rect width="250" height="44" rx="10" fill="#FFFDF9" stroke="#DEDCD5" stroke-width="1"/><text id="n3266" data-name="归档本书" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#1E2A3B" text-anchor="middle"><tspan x="125.0" y="26.550000000000004">归档本书</tspan></text></g><g id="n3267" data-name="Button / 永久删除…" data-target="S48" tabindex="0" role="button" aria-label="Button / 永久删除…" transform="translate(24,249)"><text id="n3268" data-name="永久删除…" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#284C56" text-anchor="middle"><tspan x="125.0" y="26.550000000000004">永久删除…</tspan></text></g><text id="n3269" data-name="危险操作只使用明确、独立的确认界面。" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#667281" text-anchor="start"><tspan x="324" y="266.4">危险操作只使用明确、独立的确认界面。</tspan></text></g></g></svg>