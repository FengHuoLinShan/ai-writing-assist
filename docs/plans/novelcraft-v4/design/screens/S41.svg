t-weight="500" fill="#284C56" text-anchor="middle"><tspan x="177.0" y="17.200000000000003">私人分支 · 截至原作第 8 章</tspan></text></g><g id="n3821" data-name="Reading card" transform="translate(12,219)"><rect width="366" height="557" rx="16" fill="#FFFDF9" stroke="none" stroke-width="1"/><text id="n3822" data-name="城门将关" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="28" font-weight="400" fill="#1E2A3B" text-anchor="start"><tspan x="22" y="51.800000000000004">城门将关</tspan></text><text id="n3823" data-name="守卫抬起手，拦住了你。  “明早再来。”他说。  你摸到衣襟里的信。信封上没有名字，只有一道像井口一样的圆印" font-family="Noto Serif SC,Noto Serif CJK SC,Songti SC,serif" font-size="19" font-weight="400" fill="#485365" text-anchor="start"><tspan x="22" y="108.9">守卫抬起手，拦住了你。</tspan><tspan x="22" y="145.95"></tspan><tspan x="22" y="183.0">“明早再来。”他说。</tspan><tspan x="22" y="220.05"></tspan><tspan x="22" y="257.1">你摸到衣襟里的信。信封上没有名字</tspan><tspan x="22" y="294.15">，只有一道像井口一样的圆印。</tspan></text><rect id="n3824" data-name="Surface" x="20" y="367" width="326" height="88" rx="10" fill="#F6F4F0" stroke="none"/><text id="n3825" data-name="我想向守卫说明…" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#667281" text-anchor="start"><tspan x="35" y="407.7">我想向守卫说明…</tspan></text><g id="n3826" data-name="Button / 继续故事" data-target="S41" tabindex="0" role="button" aria-label="Button / 继续故事" transform="translate(20,480)"><rect width="326" height="44" rx="10" fill="#284C56" stroke="none" stroke-width="1"/><text id="n3827" data-name="继续故事" font-family="Noto Sans SC,Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle"><tspan x="163.0" y="26.550000000000004">继续故事</tspan></text></g></g><rect id="n3828" data-name="Surface" x="145" y="827" width="100" height="4" rx="2" fill="#1E2A3B" stroke="none"/></g></svg>