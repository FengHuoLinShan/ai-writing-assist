schema_version = 1

compatibility_modules = []

# This registry is the machine-readable inventory for current architecture
# documentation. Historical plans, audits, acceptance reports and archived
# diagrams are intentionally excluded.
architecture_files = [
  "docs/architecture/README.md",
  "docs/architecture/architecture-documents.toml",
  "docs/architecture/documentation-maintenance.md",
  "docs/architecture/module-architecture.drawio",
  "docs/architecture/module-architecture.html",
]

central_documents = [
  "README.md",
  "AGENTS.md",
  "CLAUDE.md",
  "CONTEXT.md",
  "development-guide.md",
  "testing-guide.md",
  "docs/README.md",
  "docs/00_整体设计.md",
  "docs/01_数据库设计.md",
  "docs/architecture/README.md",
  "docs/architecture/documentation-maintenance.md",
  "docs/adr/README.md",
  "docs/prompts/Prompt体系设计.md",
  "docs/核心业务场景与预期行为.md",
]

adr_index = "docs/adr/README.md"
database_catalog = "docs/01_数据库设计.md"
frontend_route_catalogs = [
  "docs/00_整体设计.md",
  "docs/modules/14_frontend.md",
  "frontend-console/README.md",
]
task_catalogs = [
  "docs/modules/12_infrastructure.md",
  "backend/infrastructure/tasks/README.md",
]
prompt_catalog = "docs/prompts/Prompt体系设计.md"
module_catalogs = [
  "CONTEXT.md",
  "docs/README.md",
  "docs/00_整体设计.md",
  "docs/architecture/README.md",
]

[[components]]
name = "account"
kind = "business"
source_roots = ["backend/modules/account"]
design_docs = ["docs/modules/17_account.md"]
code_docs = ["backend/modules/account/README.md"]
api_prefixes = [
  "/api/auth",
  "/api/account",
  "/api/auth/wechat",
  "/api/auth/reauth/wechat",
]

[[components]]
name = "project"
kind = "business"
source_roots = ["backend/modules/project"]
design_docs = ["docs/modules/01_project.md"]
code_docs = ["backend/modules/project/README.md"]
api_prefixes = ["/api/projects"]

[[components]]
name = "imports"
kind = "business"
source_roots = ["backend/modules/imports"]
design_docs = ["docs/modules/13_imports.md"]
code_docs = ["backend/modules/imports/README.md"]
api_prefixes = ["/api/imports"]

[[components]]
name = "world"
kind = "business"
source_roots = ["backend/modules/world"]
design_docs = ["docs/modules/02_world.md", "docs/modules/15_map.md"]
code_docs = ["backend/modules/world/README.md"]
api_prefixes = ["/api/world", "/api/world/map-atlas"]

[[components]]
name = "story"
kind = "business"
source_roots = [
  "backend/modules/story",
]
design_docs = [
  "docs/modules/05_memory.md",
  "docs/modules/07_outline.md",
  "docs/modules/19_story.md",
]
code_docs = ["backend/modules/story/README.md"]
api_prefixes = [
  "/api/novels/{novel_id}/memories",
  "/api/outline",
  "/api/story",
]

[[components]]
name = "evidence"
kind = "business"
source_roots = [
  "backend/modules/evidence",
]
design_docs = ["docs/modules/08_evidence.md"]
code_docs = [
  "backend/modules/evidence/README.md",
  "backend/modules/evidence/indexing/README.md",
  "backend/modules/evidence/compilation/README.md",
]
api_prefixes = ["/api/evidence"]

[[components]]
name = "writing"
kind = "business"
source_roots = ["backend/modules/writing"]
design_docs = ["docs/modules/11_writing.md"]
code_docs = ["backend/modules/writing/README.md"]
api_prefixes = ["/api/writing"]

[[components]]
name = "interaction"
kind = "business"
source_roots = ["backend/modules/interaction"]
design_docs = ["docs/modules/18_interaction.md"]
code_docs = ["backend/modules/interaction/README.md"]
api_prefixes = ["/api/interactions"]

[[components]]
name = "infrastructure"
kind = "shared"
source_roots = ["backend/infrastructure"]
design_docs = ["docs/modules/12_infrastructure.md"]
code_docs = [
  "backend/infrastructure/llm/README.md",
  "backend/infrastructure/tasks/README.md",
]
api_prefixes = ["/api/tasks"]

[[components]]
name = "frontend"
kind = "client"
source_roots = ["frontend-console"]
design_docs = ["docs/modules/14_frontend.md"]
code_docs = ["frontend-console/README.md"]
api_prefixes = []

[[components]]
name = "prompts"
kind = "runtime-contract"
source_roots = ["backend/prompts"]
design_docs = ["docs/prompts/Prompt体系设计.md"]
code_docs = []
api_prefixes = []

[[impact_rules]]
id = "module-production"
description = "Any business-module production behavior change"
source_globs = ["backend/modules/**/*.py"]
exclude_globs = [
  "backend/modules/**/test_*.py",
  "backend/modules/**/tests/*.py",
  "backend/modules/**/tests/**/*.py",
]
required_documents = ["{component_design_docs}", "{component_code_docs}"]

[[impact_rules]]
id = "module-contract"
description = "Module API, stable contracts and facade changes"
source_globs = [
  "backend/modules/*/api.py",
  "backend/modules/*/contracts.py",
  "backend/modules/*/facade.py",
]
required_documents = ["{component_design_docs}", "{component_code_docs}"]

[[impact_rules]]
id = "module-schema"
description = "Module ORM and request/response schema changes"
source_globs = [
  "backend/modules/*/models.py",
  "backend/modules/*/*_models.py",
  "backend/modules/*/models/*.py",
  "backend/modules/*/schemas.py",
]
required_documents = [
  "{component_design_docs}",
  "{component_code_docs}",
  "docs/01_数据库设计.md",
]

[[impact_rules]]
id = "module-tasks"
description = "Business task handler and recovery changes"
source_globs = ["backend/modules/*/tasks.py"]
required_documents = [
  "{component_design_docs}",
  "{component_code_docs}",
  "docs/modules/12_infrastructure.md",
  "backend/infrastructure/tasks/README.md",
]

[[impact_rules]]
id = "database-migrations"
description = "Alembic schema changes"
source_globs = [
  "backend/alembic/env.py",
  "backend/alembic/versions/*.py",
]
required_documents = ["docs/01_数据库设计.md"]

[[impact_rules]]
id = "application-topology"
description = "Backend router, middleware and worker composition changes"
source_globs = [
  "backend/app/main.py",
  "backend/app/bootstrap.py",
  "backend/run_worker.py",
]
required_documents = [
  "CLAUDE.md",
  "CONTEXT.md",
  "docs/00_整体设计.md",
  "docs/architecture/README.md",
  "docs/architecture/module-architecture.drawio",
  "docs/architecture/module-architecture.html",
]

[[impact_rules]]
id = "shared-foundation"
description = "Core and shared architecture changes"
source_globs = [
  "backend/core/*.py",
  "backend/shared/*.py",
]
required_documents = [
  "docs/00_整体设计.md",
  "docs/modules/12_infrastructure.md",
]

[[impact_rules]]
id = "infrastructure-production"
description = "Any shared infrastructure behavior change"
source_globs = ["backend/infrastructure/**/*.py"]
exclude_globs = [
  "backend/infrastructure/**/test_*.py",
  "backend/infrastructure/**/tests/*.py",
  "backend/infrastructure/**/tests/**/*.py",
]
required_documents = [
  "docs/modules/12_infrastructure.md",
]

[[impact_rules]]
id = "llm-infrastructure"
description = "LLM provider, client, guard or runtime changes"
source_globs = ["backend/infrastructure/llm/*.py"]
required_documents = [
  "docs/modules/12_infrastructure.md",
  "backend/infrastructure/llm/README.md",
]

[[impact_rules]]
id = "task-infrastructure"
description = "Queue, lease, worker or task API changes"
source_globs = ["backend/infrastructure/tasks/*.py"]
required_documents = [
  "docs/modules/12_infrastructure.md",
  "backend/infrastructure/tasks/README.md",
]

[[impact_rules]]
id = "frontend-routing"
description = "Frontend route host, shell navigation or mount lifecycle changes"
source_globs = [
  "frontend-console/router.js",
  "frontend-console/vue/mountIsland.js",
  "frontend-console/vue/shell/navigation.js",
]
required_documents = [
  "docs/00_整体设计.md",
  "docs/modules/14_frontend.md",
  "frontend-console/README.md",
]

[[impact_rules]]
id = "frontend-production"
description = "Any frontend production behavior change"
source_globs = [
  "frontend-console/*.js",
  "frontend-console/**/*.js",
  "frontend-console/**/*.vue",
]
exclude_globs = [
  "frontend-console/tests/*.js",
  "frontend-console/tests/**/*.js",
]
required_documents = [
  "docs/modules/14_frontend.md",
  "frontend-console/README.md",
]

[[impact_rules]]
id = "frontend-wire"
description = "Frontend API and bridge wire changes"
source_globs = [
  "frontend-console/api.js",
  "frontend-console/apiContracts.js",
  "frontend-console/vue/bridge/*.js",
]
required_documents = [
  "docs/modules/14_frontend.md",
  "frontend-console/README.md",
]

[[impact_rules]]
id = "prompt-contracts"
description = "Prompt template or module-owned Prompt changes"
source_globs = [
  "backend/prompts/*.md",
  "backend/modules/*/prompts.py",
]
required_documents = [
  "docs/prompts/Prompt体系设计.md",
  "{component_design_docs}",
  "{component_code_docs}",
]

[[impact_rules]]
id = "architecture-decisions"
description = "ADR additions or status changes"
source_globs = ["docs/adr/*.md"]
required_documents = ["docs/adr/README.md"]

[[impact_rules]]
id = "architecture-governance"
description = "Architecture documentation process and gate changes"
source_globs = [
  "AGENTS.md",
  "CLAUDE.md",
  "backend/**/AGENTS.md",
  "backend/**/CLAUDE.md",
  "Makefile",
  ".github/pull_request_template.md",
  ".github/workflows/architecture-docs.yml",
  "docs/architecture/architecture-documents.toml",
  "scripts/check_architecture_docs.py",
]
required_documents = [
  "development-guide.md",
  "testing-guide.md",
  "docs/architecture/README.md",
  "docs/architecture/documentation-maintenance.md",
]
