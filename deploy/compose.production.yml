name: ai-writing-assist

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "10"

x-first-party-runtime-hardening: &first-party-runtime-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-runtime-environment: &runtime-environment
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUTH_MODE: ${AUTH_MODE:?Choose AUTH_MODE in deploy/.env.production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  POOL_SIZE: ${POOL_SIZE:-10}
  MAX_OVERFLOW: ${MAX_OVERFLOW:-20}
  LLM_SETTINGS_ENCRYPTION_KEY: ${LLM_SETTINGS_ENCRYPTION_KEY:?Set LLM_SETTINGS_ENCRYPTION_KEY}
  LLM_TRUST_ENV: "false"
  LLM_PROXY_URL: ${LLM_PROXY_URL:-}
  LLM_HEALTH_REQUIRED: ${LLM_HEALTH_REQUIRED:-true}
  LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:?Set LLM_RATE_LIMIT_PER_MINUTE}
  LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-4}
  LLM_RETRY_MAX_ATTEMPTS: ${LLM_RETRY_MAX_ATTEMPTS:-3}
  LLM_RETRY_BASE_DELAY: ${LLM_RETRY_BASE_DELAY:-1.0}
  LLM_RETRY_MAX_DELAY: ${LLM_RETRY_MAX_DELAY:-60.0}
  LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
  LLM_CIRCUIT_BREAKER_RESET_SECONDS: ${LLM_CIRCUIT_BREAKER_RESET_SECONDS:-60.0}
  MAP_ATLAS_S3_BUCKET: ${MAP_ATLAS_S3_BUCKET:?Set MAP_ATLAS_S3_BUCKET}
  WORLD_OBJECT_S3_BUCKET: ${WORLD_OBJECT_S3_BUCKET:?Set WORLD_OBJECT_S3_BUCKET}
  MAP_ATLAS_S3_REGION: ${MAP_ATLAS_S3_REGION:-us-east-1}
  MAP_ATLAS_S3_ENDPOINT_URL: ${MAP_ATLAS_S3_ENDPOINT_URL:-}
  MAP_ATLAS_S3_ACCESS_KEY_ID: ${MAP_ATLAS_S3_ACCESS_KEY_ID:-}
  MAP_ATLAS_S3_SECRET_ACCESS_KEY: ${MAP_ATLAS_S3_SECRET_ACCESS_KEY:-}
  MAP_ATLAS_S3_FORCE_PATH_STYLE: ${MAP_ATLAS_S3_FORCE_PATH_STYLE:-false}
  TASK_WORKER_MAX_CONCURRENT_TASKS: ${TASK_WORKER_MAX_CONCURRENT_TASKS:-1}
  IMPORT_MAX_CHAPTERS: ${IMPORT_MAX_CHAPTERS:-1000}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-base-zh-v1.5}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:80/v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local-tei-internal}
  RAG_PREWARM_ON_STARTUP: ${RAG_PREWARM_ON_STARTUP:-false}
  EMBEDDING_BATCH_QUEUE_DELAY_MS: ${EMBEDDING_BATCH_QUEUE_DELAY_MS:-5}
  EMBEDDING_BATCH_QUEUE_MAX_ITEMS: ${EMBEDDING_BATCH_QUEUE_MAX_ITEMS:-64}
  EMBEDDING_BATCH_QUEUE_TIMEOUT_SECONDS: ${EMBEDDING_BATCH_QUEUE_TIMEOUT_SECONDS:-30.0}
  INFERENCE_WORKER_STARTUP_TIMEOUT: ${INFERENCE_WORKER_STARTUP_TIMEOUT:-300.0}

x-api-environment: &api-environment
  <<: *runtime-environment
  APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in deploy/.env.production}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in deploy/.env.production}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  TERMS_VERSION: ${TERMS_VERSION:-2026-07-23}
  PRIVACY_VERSION: ${PRIVACY_VERSION:-2026-07-23}
  AUTHING_WECHAT_ENABLED: ${AUTHING_WECHAT_ENABLED:-false}
  AUTHING_ISSUER: ${AUTHING_ISSUER:-}
  AUTHING_CLIENT_ID: ${AUTHING_CLIENT_ID:-}
  AUTHING_CLIENT_SECRET: ${AUTHING_CLIENT_SECRET:-}
  AUTHING_REDIRECT_URI: ${AUTHING_REDIRECT_URI:-}
  HTTP_RATE_LIMIT_PER_MINUTE: ${HTTP_RATE_LIMIT_PER_MINUTE:?Set HTTP_RATE_LIMIT_PER_MINUTE}
  HTTP_RATE_LIMIT_BURST: ${HTTP_RATE_LIMIT_BURST:-60}
  HTTP_RATE_LIMIT_MAX_CLIENTS: ${HTTP_RATE_LIMIT_MAX_CLIENTS:-10000}

x-ops-environment: &ops-environment
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07}
    platform: linux/amd64
    restart: unless-stopped
    logging: *bounded-logging
    command:
      [
        "--model-id",
        "${EMBEDDING_MODEL_ID:-BAAI/bge-base-zh-v1.5}",
        "--served-model-name",
        "${EMBEDDING_MODEL:-bge-base-zh-v1.5}",
        "--max-concurrent-requests",
        "${EMBEDDING_MAX_CONCURRENT_REQUESTS:-16}",
      ]
    volumes:
      - embedding-model-cache:/data
    networks:
      - egress

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE}
    restart: unless-stopped
    logging: *bounded-logging
    command: server /data
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  minio-init:
    image: ${MINIO_MC_IMAGE:?Set MINIO_MC_IMAGE}
    restart: "no"
    logging: *bounded-logging
    entrypoint: ["/bin/sh", "/usr/local/bin/init-minio.sh"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MAP_ATLAS_S3_ACCESS_KEY_ID:?Set MAP_ATLAS_S3_ACCESS_KEY_ID}
      MINIO_APP_SECRET_KEY: ${MAP_ATLAS_S3_SECRET_ACCESS_KEY:?Set MAP_ATLAS_S3_SECRET_ACCESS_KEY}
      MAP_ATLAS_S3_BUCKET: ${MAP_ATLAS_S3_BUCKET:?Set MAP_ATLAS_S3_BUCKET}
      WORLD_OBJECT_S3_BUCKET: ${WORLD_OBJECT_S3_BUCKET:?Set WORLD_OBJECT_S3_BUCKET}
    volumes:
      - ../docker/init-minio.sh:/usr/local/bin/init-minio.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:mode=1777
    networks:
      - data

  api:
    <<: *first-party-runtime-hardening
    image: ai-writing-assist-backend:${RELEASE_ID:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 8
    stop_grace_period: 30s
    tmpfs:
      - /tmp:mode=1777
    ports:
      - "127.0.0.1:${API_LOOPBACK_PORT:-18000}:8000"
    networks:
      data:
      egress:

  worker:
    <<: *first-party-runtime-hardening
    image: ai-writing-assist-backend:${RELEASE_ID:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    command: ["python", "run_worker.py"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "infrastructure/tasks/liveness.py",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 8
    stop_grace_period: 2m
    tmpfs:
      - /tmp:mode=1777
    networks:
      - data
      - egress

  frontend:
    <<: *first-party-runtime-hardening
    image: ai-writing-assist-frontend:${RELEASE_ID:-local}
    build:
      context: ..
      dockerfile: frontend-console/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    tmpfs:
      - /run:mode=0755,uid=101,gid=101
      - /var/cache/nginx:mode=0755,uid=101,gid=101
    ports:
      - "127.0.0.1:${FRONTEND_LOOPBACK_PORT:-18080}:8080"

  migrate:
    <<: *first-party-runtime-hardening
    profiles: ["ops"]
    image: ai-writing-assist-backend:${RELEASE_ID:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *ops-environment
      MAP_ATLAS_DESTRUCTIVE_MIGRATION_CONFIRMATION: ${MAP_ATLAS_DESTRUCTIVE_MIGRATION_CONFIRMATION:-}
      MAP_ATLAS_DESTRUCTIVE_MIGRATION_BACKUP_NAME: ${MAP_ATLAS_DESTRUCTIVE_MIGRATION_BACKUP_NAME:-}
      MAP_ATLAS_DESTRUCTIVE_MIGRATION_BACKUP_SHA256: ${MAP_ATLAS_DESTRUCTIVE_MIGRATION_BACKUP_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *bounded-logging
    tmpfs:
      - /tmp:mode=1777
    networks:
      - data
      - egress

  account-maintenance:
    <<: *first-party-runtime-hardening
    profiles: ["ops"]
    image: ai-writing-assist-backend:${RELEASE_ID:-local}
    command: ["python", "scripts/manage_accounts.py", "purge-due", "--execute"]
    environment: *ops-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *bounded-logging
    tmpfs:
      - /tmp:mode=1777
    networks:
      - data
      - egress

volumes:
  postgres-data:
    name: ai-writing-assist-postgres-data
  embedding-model-cache:
    name: ai-writing-assist-embedding-model-cache
  minio-data:
    name: ai-writing-assist-minio-data

networks:
  data:
    name: ai-writing-assist-data
    internal: true
  egress:
    name: ai-writing-assist-egress
