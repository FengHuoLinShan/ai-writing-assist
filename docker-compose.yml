services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:50978048218cfa6f31cd833a1c828cfb94e908be65842aac09ef1d5644f7b002}
    profiles: [search]
    dns: [1.1.1.1]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: ai-novel-db
    restart: unless-stopped
    ports:
      - "5207:5432"
    environment:
      POSTGRES_DB: ai_novel_engine
      POSTGRES_USER: novelist
      POSTGRES_PASSWORD: novel_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelist -d ai_novel_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: ai-novel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: novel-minio-root
      MINIO_ROOT_PASSWORD: novel_minio_root_pass
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z@sha256:470f5546b596e16c7816b9c3fa7a78ce4076bb73c2c73f7faeec0c8043923123
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/init-minio.sh"]
    # Worktrees reuse the fixed-name MinIO container. Sharing its network
    # namespace keeps the one-shot initializer connected even when that
    # container was originally created by a sibling Compose project.
    network_mode: "container:ai-novel-minio"
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ENDPOINT_URL: http://127.0.0.1:9000
      MINIO_ROOT_USER: novel-minio-root
      MINIO_ROOT_PASSWORD: novel_minio_root_pass
      MINIO_APP_ACCESS_KEY: novelist
      MINIO_APP_SECRET_KEY: novel_minio_dev_pass
      MAP_ATLAS_S3_BUCKET: ai-writing-assist-map-atlas
      WORLD_OBJECT_S3_BUCKET: ai-writing-assist-world-objects
    volumes:
      - ./docker/init-minio.sh:/usr/local/bin/init-minio.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:mode=1777

volumes:
  pgdata:
  minio-data:
