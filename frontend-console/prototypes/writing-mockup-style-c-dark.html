<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作工作台 — 午夜星河风格 Mock-up</title>
<style>
:root {
  --bg-base: #1A1425;
  --bg-panel: #241D35;
  --bg-elevated: #2E2545;
  --bg-hover: #352D4E;
  --bg-active: #3E345A;
  --bg-editor: #1E1929;
  --text-primary: #EDE6FF;
  --text-body: #D8D0E8;
  --text-secondary: #A9A0C0;
  --text-tertiary: #7A7090;
  --text-quaternary: #4E4666;
  --accent: #A490C2;
  --accent-soft: rgba(164, 144, 194, 0.12);
  --accent-hover: #C4B4E0;
  --accent-glow: rgba(164, 144, 194, 0.20);
  --success: #6EE7B7;
  --warning: #FCD34D;
  --error: #FCA5A5;
  --border: #352D4E;
  --border-subtle: #2E2545;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-body: "Noto Serif SC", "Source Han Serif SC", Georgia, "STSong", serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family:var(--font-ui); font-size:14px; color:var(--text-body); background:var(--bg-base); }

/* Subtle starfield background via pseudo element */
body::before {
  content:''; position:fixed; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(circle at 80% 20%, rgba(164,144,194,0.04) 0%, transparent 50%),
              radial-gradient(circle at 20% 80%, rgba(74,78,143,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}
#app { width:100vw; height:100vh; display:flex; flex-direction:column; position:relative; z-index:1; }

/* Topbar — Dark Glass */
#topbar {
  height:54px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; background:rgba(36,29,53,0.85); border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px); z-index:100;
}
.logo { font-weight:700; font-size:15px; color:var(--text-primary); display:flex; align-items:center; gap:8px; letter-spacing:0.5px; }
.logo-mark { color:var(--accent); font-size:18px; }
.topbar-center { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-tertiary); }
.topbar-right { display:flex; align-items:center; gap:12px; }
.status-indicator { width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 0 2px rgba(110,231,183,0.2); }
.avatar { width:30px; height:30px; border-radius:50%; background:var(--bg-active); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-secondary); border:1px solid var(--border); }
.wordcount-badge { display:flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; background:var(--bg-active); color:var(--text-secondary); font-family:monospace; font-size:12px; border:1px solid var(--border); }

#main-layout { flex:1; display:flex; overflow:hidden; }

/* Sidebar — Dark */
#sidebar { width:64px; min-width:64px; background:var(--bg-panel); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding-top:20px; gap:6px; }
.nav-item { width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:12px; color:var(--text-tertiary); cursor:pointer; transition:all .15s ease; position:relative; }
.nav-item:hover { background:var(--bg-hover); color:var(--text-secondary); }
.nav-item.active { background:var(--accent-soft); color:var(--accent); }
.nav-item.active::before { content:''; position:absolute; left:-10px; top:50%; transform:translateY(-50%); width:3px; height:24px; background:var(--accent); border-radius:2px; box-shadow:0 0 8px var(--accent-glow); }
.nav-icon { width:20px; height:20px; stroke:currentColor; stroke-width:1.75; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.nav-label { font-size:9px; position:absolute; bottom:2px; }

#workspace { flex:1; display:flex; flex-direction:column; overflow:hidden; margin:0 28px; }
#workspace-header { display:flex; align-items:center; justify-content:space-between; padding:22px 0 14px; flex-shrink:0; }
#view-title { font-size:20px; font-weight:700; color:var(--text-primary); letter-spacing:0.5px; }

/* Writing Layout */
.writing-workspace-layout { display:grid; grid-template-columns:220px 1fr 250px; gap:20px; align-items:start; height:100%; }

/* Left: Chapter Tree — Dark Card */
.chapter-tree-card { background:var(--bg-panel); border-radius:var(--radius-lg); border:1px solid var(--border); padding:18px; max-height:calc(100vh - 200px); overflow-y:auto; }
.chapter-tree-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border-subtle); }
.chapter-tree-title { font-size:13px; font-weight:700; color:var(--text-primary); letter-spacing:0.5px; }
.chapter-tree-actions { display:flex; gap:6px; }
.chapter-row { display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; margin-bottom:3px; border:0; border-radius:var(--radius-sm); background:transparent; color:inherit; cursor:pointer; font:inherit; text-align:left; transition:all .12s ease; }
.chapter-row:hover { background:var(--bg-hover); }
.chapter-row--active { background:var(--accent-soft); border-left:3px solid var(--accent); padding-left:7px; box-shadow:0 0 12px rgba(164,144,194,0.08); }
.chapter-row__status { flex-shrink:0; }
.chapter-status { width:7px; height:7px; border-radius:50%; display:block; }
.chapter-status--draft { background:var(--warning); box-shadow:0 0 4px rgba(252,211,77,0.3); }
.chapter-status--published { background:var(--success); box-shadow:0 0 4px rgba(110,231,183,0.3); }
.chapter-status--empty { background:var(--text-quaternary); }
.chapter-row__info { flex:1; min-width:0; }
.chapter-row__title { display:flex; gap:6px; font-size:12px; color:var(--text-body); }
.chapter-number { font-weight:600; white-space:nowrap; }
.chapter-title-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary); }
.chapter-row__meta { margin-top:2px; font-size:10px; color:var(--text-tertiary); font-family:monospace; }

.scene-tree-node { margin-bottom:3px; }
.scene-tree-scene { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:var(--radius-sm); font-size:12px; cursor:pointer; }
.scene-tree-scene:hover { background:var(--bg-hover); }
.toggle-icon { font-size:10px; color:var(--text-tertiary); width:12px; text-align:center; }
.scene-tree-chapters { margin-left:16px; }

/* Center: Editor — Dark Immersive */
#writing-editor-container { min-width:0; display:flex; flex-direction:column; }
.editor-meta { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
.editor-meta-left { display:flex; align-items:center; gap:10px; padding-top:2px; }
.chapter-title-display { font-size:15px; font-weight:700; color:var(--text-primary); }
.writing-version-badge { font-size:11px; color:var(--text-tertiary); background:var(--bg-hover); padding:3px 10px; border-radius:12px; border:1px solid var(--border); }
.writing-save-badge { font-size:11px; color:var(--text-tertiary); }
.writing-save-badge.unsaved { color:var(--warning); }
.writing-save-badge.saved { color:var(--success); }

.writing-editor-buttons { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:6px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-panel); color:var(--text-secondary); font-size:13px; cursor:pointer; transition:all .12s ease; font-family:var(--font-ui); white-space:nowrap; }
.btn:hover { border-color:var(--text-tertiary); color:var(--text-body); background:var(--bg-hover); }
.btn:active { transform:scale(0.98); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#1A1425; font-weight:600; }
.btn-primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); color:#1A1425; box-shadow:0 0 16px var(--accent-glow); }
.btn-ghost { background:transparent; border-color:transparent; color:var(--text-tertiary); padding:6px 10px; font-size:12px; }
.btn-ghost:hover { background:var(--bg-hover); color:var(--text-secondary); }
.btn-sm { padding:4px 10px; font-size:12px; }

.writing-tools-menu { position:relative; display:inline-block; }
.writing-tools-menu__summary { list-style:none; cursor:pointer; }
.writing-tools-menu__body { display:none; position:absolute; right:0; top:calc(100% + 4px); width:240px; padding:10px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-panel); box-shadow:var(--shadow-lg); z-index:10; }

.writing-conflict-strip { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:12px; }
.writing-conflict-latest { padding:4px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-hover); color:var(--text-secondary); cursor:pointer; font-size:12px; }

.version-bar { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:12px; }
.version-bar select { background:var(--bg-hover); color:var(--text-body); border:1px solid var(--border); padding:3px 8px; border-radius:var(--radius-sm); font-size:12px; }

.chapter-title-input { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-editor); color:var(--text-primary); font-size:15px; font-family:var(--font-ui); margin-bottom:10px; outline:none; transition:border-color .2s, box-shadow .2s; }
.chapter-title-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
.chapter-title-input::placeholder { color:var(--text-tertiary); }

.novel-editor { width:100%; min-height:55vh; border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px 28px; background:var(--bg-editor); color:var(--text-body); font-family:var(--font-body); font-size:16px; line-height:1.85; resize:vertical; outline:none; transition:border-color .2s, box-shadow .2s; box-shadow:var(--shadow-sm); }
.novel-editor:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow), var(--shadow-md); }
.novel-editor::placeholder { color:var(--text-quaternary); }

.writing-wordcount-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; margin-top:10px; border-radius:var(--radius-md); background:var(--bg-panel); border:1px solid var(--border); font-family:monospace; font-size:12px; color:var(--text-secondary); }
.wc-bar-left { display:flex; gap:12px; align-items:center; }
.wc-divider { color:var(--text-quaternary); }
.wc-bar-right { display:flex; align-items:center; gap:10px; }
.wc-daily-goal { display:flex; align-items:center; gap:8px; }
.wc-goal-label { font-size:10px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.5px; }
.wc-goal-progress { width:72px; height:4px; border-radius:2px; background:var(--bg-hover); overflow:hidden; }
.wc-goal-fill { height:100%; border-radius:2px; background:linear-gradient(90deg, var(--accent), #C4B4E0); transition:width .3s ease; }

/* Right: Scene Panel — Dark */
.scene-cockpit { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; max-height:calc(100vh - 200px); overflow-y:auto; }
.scene-cockpit__title { display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border-subtle); color:var(--text-primary); }
.cockpit-tabs { display:flex; gap:2px; margin-bottom:12px; border-bottom:1px solid var(--border-subtle); }
.cockpit-tab { flex:1; border:0; border-bottom:2px solid transparent; padding:6px 4px; background:transparent; color:var(--text-tertiary); cursor:pointer; font-size:12px; }
.cockpit-tab:hover { color:var(--text-secondary); background:var(--bg-hover); }
.cockpit-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.cockpit-panel { display:none; }
.cockpit-panel.active { display:block; }
.cockpit-empty { padding:20px 0; text-align:center; color:var(--text-tertiary); }
.cockpit-person-card { display:flex; align-items:center; gap:8px; padding:8px; border-radius:var(--radius-sm); background:var(--bg-hover); margin-bottom:6px; }
.person-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
.person-name { font-weight:600; color:var(--text-body); font-size:12px; }
.person-status { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
.writing-map-summary { padding:10px; border-radius:var(--radius-sm); background:var(--bg-hover); margin-top:8px; }
.writing-map-summary div { margin-bottom:4px; }

::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--text-quaternary); border-radius:3px; }

.badge { display:inline-block; font-size:11px; padding:1px 5px; border-radius:4px; font-family:monospace; }
.badge-canonical { color:var(--success); background:rgba(110,231,183,0.1); }

@media (max-width:1024px) {
  .writing-workspace-layout { grid-template-columns:180px 1fr 200px; gap:14px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-left"><span class="logo"><span class="logo-mark">&#9670;</span>NovelCraft</span></div>
    <div class="topbar-center"><span>我的小说</span><span style="opacity:0.5;">&#183;</span><span>写作</span></div>
    <div class="topbar-right">
      <span class="status-indicator connected"></span>
      <div class="wordcount-badge"><span>1,240</span>/<span>3,456</span></div>
      <div class="avatar">U</div>
    </div>
  </header>

  <div id="main-layout">
    <nav id="sidebar">
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"/></svg></div>
      <div class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15"/><path d="M15 6v15"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="15" x2="13" y2="15" stroke="currentColor" stroke-width="1.5"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg></div>
    </nav>

    <main id="workspace">
      <header id="workspace-header"><h2 id="view-title">手动工作台</h2></header>
      <div id="workspace-content">
        <p style="color:var(--text-tertiary); font-size:12px; margin-bottom:10px;">手动工作台 — 选择章节，撰写正文。</p>
        <div class="writing-workspace-layout">
          <div id="writing-tree-container">
            <div class="card chapter-tree-card">
              <div class="chapter-tree-header">
                <span class="chapter-tree-title">章节</span>
                <div class="chapter-tree-actions">
                  <button class="btn btn-sm" title="上一章">&#8592;</button>
                  <button class="btn btn-sm" title="下一章">&#8594;</button>
                  <button class="btn btn-sm">+ 新建</button>
                </div>
              </div>
              <div class="scene-tree-node">
                <div class="scene-tree-scene">
                  <span class="toggle-icon">&#9660;</span>
                  <span style="font-weight:600;">序章：启程</span>
                  <span style="color:var(--text-tertiary); font-size:10px;">(3章)</span>
                </div>
                <div class="scene-tree-chapters">
                  <button class="chapter-row chapter-row--active">
                    <div class="chapter-row__status"><span class="chapter-status chapter-status--draft"></span></div>
                    <div class="chapter-row__info">
                      <div class="chapter-row__title"><span class="chapter-number">第 1 章</span><span class="chapter-title-text">迷雾中的信</span></div>
                      <div class="chapter-row__meta">1,240 字</div>
                    </div>
                  </button>
                  <button class="chapter-row">
                    <div class="chapter-row__status"><span class="chapter-status chapter-status--published"></span></div>
                    <div class="chapter-row__info">
                      <div class="chapter-row__title"><span class="chapter-number">第 2 章</span><span class="chapter-title-text">初见</span></div>
                      <div class="chapter-row__meta">3,456 字</div>
                    </div>
                  </button>
                  <button class="chapter-row">
                    <div class="chapter-row__status"><span class="chapter-status chapter-status--empty"></span></div>
                    <div class="chapter-row__info">
                      <div class="chapter-row__title"><span class="chapter-number">第 3 章</span></div>
                      <div class="chapter-row__meta">0 字</div>
                    </div>
                  </button>
                </div>
              </div>
              <div class="scene-tree-node">
                <div class="scene-tree-scene">
                  <span class="toggle-icon">&#9654;</span>
                  <span style="color:var(--text-tertiary); font-size:12px;">未归类</span>
                  <span style="color:var(--text-tertiary); font-size:10px;">(2章)</span>
                </div>
              </div>
            </div>
          </div>

          <div id="writing-editor-container">
            <div class="editor-meta">
              <div class="editor-meta-left">
                <span class="chapter-title-display">第 1 章</span>
                <span class="writing-version-badge">v3</span>
                <span class="writing-save-badge unsaved">未保存</span>
              </div>
              <div class="writing-editor-buttons">
                <button class="btn btn-primary">暂存</button>
                <button class="btn btn-primary">发布</button>
                <button class="btn">剧情设定冲突检查</button>
                <button class="btn btn-ghost">AI 续写</button>
                <button class="btn btn-ghost">导出</button>
                <button class="btn btn-ghost">大纲</button>
                <button class="btn btn-ghost">专注模式</button>
                <details class="writing-tools-menu">
                  <summary class="btn btn-sm">AI 工具 &#9662;</summary>
                  <div class="writing-tools-menu__body">
                    <div style="font-weight:600; font-size:11px; color:var(--text-tertiary); margin-bottom:4px;">生成</div>
                    <button class="btn btn-sm" style="width:100%; margin-bottom:4px;">AI 生成草稿</button>
                    <div style="font-weight:600; font-size:11px; color:var(--text-tertiary); margin:8px 0 4px;">提取</div>
                    <button class="btn btn-sm" style="width:100%; margin-bottom:4px;">场景自动提取</button>
                    <button class="btn btn-sm" style="width:100%; margin-bottom:4px;">世界对象自动提取</button>
                    <button class="btn btn-sm" style="width:100%; margin-bottom:4px;">剧情线自动提取</button>
                    <button class="btn btn-sm" style="width:100%; margin-bottom:4px;">AI 提取章节卡</button>
                    <div style="font-weight:600; font-size:11px; color:var(--text-tertiary); margin:8px 0 4px;">检查</div>
                    <div style="font-weight:600; font-size:11px; color:var(--text-tertiary); margin:8px 0 4px;">地图</div>
                    <button class="btn btn-sm" style="width:100%;">打开地图</button>
                  </div>
                </details>
              </div>
            </div>
            <div class="writing-conflict-strip">
              <button class="writing-conflict-latest">14:32 &#183; 发现 2 个冲突</button>
              <span style="color:var(--text-tertiary); font-size:11px; cursor:pointer;">历史 &#9662;</span>
            </div>
            <div class="version-bar">
              <span style="color:var(--text-tertiary);">版本：</span>
              <select><option>v3 (最新)</option><option>v2</option><option>v1</option></select>
              <button class="btn btn-sm">历史</button>
