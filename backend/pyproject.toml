[project]
name = "ai-novel-structural-engine"
version = "2.0.0"
description = "AI 长篇小说结构化创作引擎 — 面向中文长篇小说的结构化创作系统"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Novel Engine Team"},
]

keywords = [
    "novel",
    "writing",
    "structured-creation",
    "fastapi",
    "ai-writing",
    "long-fiction",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Writers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Creative Writing",
    "Topic :: Text Processing",
]

dependencies = [
    "beautifulsoup4>=4.12.0",
    "chardet>=5.2.0",
    "ebooklib>=0.18.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "tiktoken>=0.6.0",
    "rapidfuzz>=3.0",
    "pypinyin>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=2.5.0",
    "joblib>=1.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "shared*", "infrastructure*", "modules*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "modules",
    "infrastructure",
    "tests",
    "app",
]
python_files = ["tests.py", "*_test.py", "test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "api: API layer tests",
    "integration: Integration/flow tests",
    "e2e: end-to-end tests requiring PostgreSQL/pgvector",
    "real_llm: tests that call a real LLM provider; disabled by default",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
